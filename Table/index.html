<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewsport" content="width=device-width, initial-scale-1.0">
        <title>Table</title>
        <link href="style.css" rel="stylesheet">
          <style>
        table,
        td,
        td,
        tfoot {
            border: 1px solid rgb(109, 18, 228);
            /* border-collapse: collapse; */
        }
    </style>
    </head>
    <body>
      <table>
        <tbody>
            <tr class="box">
                <td ><strong>Device</strong></td>
                <td><strong>Brand</strong></td>
                <td colspan="2"><strong>Specifications</strong></td>
               
                
            </tr>
            <tr>
                <td rowspan="3">Smartphone</td>
                <td rowspan="3">Apple</td>
              <span id="box2">
                <td >Model</td>
                <td>Storage</td>
              </span>
                
                
            </tr>
            <tr>
                
                <td>iPhone 12Pro</td>
                 <td>256GB</td>
                
               
            </tr>
            <tr>
           
            <td>iphone se</td>
            <td>128GB</td>
            </tr>
              <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td colspan="2">15.6"Display</td>
            
            </tr>
            <tr>
                <td>Tablet</td>
                <td>Samsung</td>
                <td colspan="2">10.5"Display</td>
                
            </tr>
        </tbody>
      </table>
    </body>
    </html>
